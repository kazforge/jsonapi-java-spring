[versions]
spotless = "8.12.0"
jspecify = "1.0.1"
errorprone = "2.53.0"
nullaway = "0.14.4"
errorprone-plugin = "5.2.0"
nullaway-plugin = "3.3.0"
junit = "6.1.3"
jacoco = "0.8.15"
sonarqube = "7.6.0.18749"
cyclonedx = "3.6.1"
jsonapi = "0.6.0"
# Consumer compatibility floor; changes require a maintainer decision.
spring-minimum = "7.0.9"
# Test-only forward compatibility target.
spring-current = "7.0.11"
boot-minimum = "4.1.2"
boot-current = "4.1.3"

[libraries]
spotless-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
hamcrest = { module = "org.hamcrest:hamcrest", version = "3.0" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
nullaway-plugin = { module = "net.ltgt.nullaway:net.ltgt.nullaway.gradle.plugin", version.ref = "nullaway-plugin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
jsonapi-api = { module = "com.kazforge:jsonapi-java-api", version.ref = "jsonapi" }
jsonapi-query = { module = "com.kazforge:jsonapi-java-query", version.ref = "jsonapi" }
jsonapi-jackson3 = { module = "com.kazforge:jsonapi-java-jackson3", version.ref = "jsonapi" }
servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version = "6.1.0" }
validation-api = { module = "jakarta.validation:jakarta.validation-api", version = "3.1.1" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version = "9.2.0.Final" }
expressly = { module = "org.glassfish.expressly:expressly", version = "6.0.0" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring-minimum" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-minimum" }
spring-current-bom = { module = "org.springframework:spring-framework-bom", version.ref = "spring-current" }
boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "boot-minimum" }
boot-current-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "boot-current" }
boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
boot-test = { module = "org.springframework.boot:spring-boot-test" }
assertj = { module = "org.assertj:assertj-core" }

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
