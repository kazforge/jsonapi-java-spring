name: Renovate

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency: renovate

jobs:
  renovate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RENOVATE_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-administration: read
          permission-vulnerability-alerts: read
          permission-members: read
      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.167.4@sha256:82f2a1375a48339c02f9a74b14f8468386c5c5e88ff10aa1674aae31df52969d
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: gradleWrapper
          RENOVATE_BRANCH_PREFIX: renovate-actions/
          # Disable fallback adoption of Mend's renovate/ branches during overlap.
          RENOVATE_BRANCH_PREFIX_OLD: renovate-actions/
          # The Java 21 toolchain is declared in shared build logic, not the root build file.
          RENOVATE_CONSTRAINTS: '{"java":"21"}'
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
