name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Unpublished version to validate and drop (no public release)
        required: true
        default: 0.1.0

permissions: {}

concurrency:
  group: spring-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require release App credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: kazforge
          repositories: jsonapi-java-spring
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app.outputs.token }}

  publication:
    needs: release-please
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify both Spring selections
        run: |
          ./gradlew clean spotlessCheck build
          ./gradlew :jsonapi-java-spring-webmvc:clean :jsonapi-java-spring-webmvc:build -PspringTestVersion=current
      - name: Build signed publications
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          REHEARSAL_VERSION: ${{ inputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingKey"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$REHEARSAL_VERSION"
          else
            VERSION="${TAG#v}"
            test "$(sed -n 's/^version=//p' gradle.properties)" = "$VERSION"
          fi
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+$|^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          ./gradlew publish -Prelease -Pversion="$VERSION"
          bash .github/scripts/central-publication.sh bundle "$VERSION"
      - name: Attest primary JAR provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/staging-deploy/com/kazforge/jsonapi-java-spring-webmvc/*/*.jar
            !build/staging-deploy/**/*-sources.jar
            !build/staging-deploy/**/*-javadoc.jar
      - name: Attest primary JAR SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/staging-deploy/com/kazforge/jsonapi-java-spring-webmvc/*/*.jar
            !build/staging-deploy/**/*-sources.jar
            !build/staging-deploy/**/*-javadoc.jar
          sbom-path: jsonapi-java-spring-webmvc/build/reports/release/bom.json
      - name: Upload and verify Central deployment
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mode=AUTOMATIC
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then mode=USER_MANAGED; fi
          bash .github/scripts/central-publication.sh upload "$mode"
