name: Java CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Spring ${{ matrix.spring-test-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-test-version: [minimum, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and verify
        if: matrix.spring-test-version == 'minimum'
        run: ./gradlew clean spotlessCheck build
      - name: Verify current Spring adapter compatibility
        if: matrix.spring-test-version == 'current'
        run: ./gradlew :jsonapi-java-spring-webmvc:clean :jsonapi-java-spring-webmvc:build -PspringTestVersion=current
      # Only main and same-repository PRs are trusted; fork PRs skip all Sonar steps.
      - name: Sonar Scan (trusted Java 21 path)
        if: matrix.spring-test-version == 'minimum' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
      # The free-tier Quality Gate can pass with new smells; fail closed on the Issues API.
      - name: Verify zero new-code Sonar issues
        if: matrix.spring-test-version == 'minimum' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-new-code-issues.sh --list
      - name: Upload build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports-${{ matrix.spring-test-version }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Java CI required
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Spring paths
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
